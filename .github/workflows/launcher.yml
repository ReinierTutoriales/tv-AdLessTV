name: Android TV launcher
on:
  # Every branch: changes are validated before they reach main.
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher.yml'
  pull_request:
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - run: chmod +x launcher/gradlew
      - name: Compile debug and release, and run Android lint
        working-directory: launcher
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:lintDebug :app:testDebugUnitTest
      - name: Preserve lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AdLessTV-lint-report
          path: |
            launcher/app/build/reports/lint-results-debug.html
            launcher/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Inspect APKs
        run: |
          test -s launcher/app/build/outputs/apk/debug/app-debug.apk
          test -s launcher/app/build/outputs/apk/release/app-release-unsigned.apk
          for apk in launcher/app/build/outputs/apk/debug/app-debug.apk launcher/app/build/outputs/apk/release/app-release-unsigned.apk; do
            declared_permissions=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump permissions "$apk")
            # Closed list: the receiver guard and the network pill (type; the Wi-Fi name also
            # needs location, requested only when the user asks for it on the TV). No INTERNET.
            unexpected_permissions=$(grep '^uses-permission' <<< "$declared_permissions" |
              grep -Fvx -e "uses-permission: name='com.adlesstv.launcher.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'" \
                -e "uses-permission: name='android.permission.ACCESS_NETWORK_STATE'" \
                -e "uses-permission: name='android.permission.ACCESS_WIFI_STATE'" \
                -e "uses-permission: name='android.permission.ACCESS_COARSE_LOCATION'" \
                -e "uses-permission: name='android.permission.ACCESS_FINE_LOCATION'" || true)
            if [ -n "$unexpected_permissions" ]; then
              echo "El lanzador solicita permisos inesperados: $apk" >&2
              echo "$declared_permissions" >&2
              exit 1
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AdLessTV-debug-apk
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Low-end target: 32-bit TV image capped at 2 GB of RAM, like budget sticks.
          - name: tv34-2gb
            api: '34'
            target: android-tv
            arch: x86
            profile: tv_1080p
            ram: 2048M
            gpu: swiftshader_indirect
          - name: tv36
            api: '36'
            target: android-tv
            arch: x86_64
            profile: tv_1080p
            ram: 2048M
            gpu: swiftshader_indirect
          # Informational: newest platform, no TV image yet.
          - name: android37
            api: '37.0'
            target: google_apis
            arch: x86_64
            profile: pixel_2
            ram: 3072M
            gpu: swiftshader
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      # Emulator Runner prepends cmdline-tools/latest to PATH during its own step.
      # The runner's old latest creates API 37 AVDs with target=android-0.
      - name: Select API 37-aware AVD manager
        if: matrix.experimental == true
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/22.0/bin/avdmanager"
          mv "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/cmdline-tools/runner-original"
          ln -s 22.0 "$ANDROID_HOME/cmdline-tools/latest"
      - name: Enable hardware virtualization
        run: sudo chmod 666 /dev/kvm
      - run: chmod +x launcher/gradlew
      - name: Layout and D-pad on Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          ram-size: ${{ matrix.ram }}
          # The Android 17 image ships a small /data; installs fail without more room.
          disk-size: 6G
          disable-animations: false
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -noaudio -no-boot-anim -camera-back none -skin 960x540
          pre-emulator-launch-script: test '${{ matrix.api }}' != '37.0' || grep -Fx 'target=android-37.0' "${ANDROID_AVD_HOME:-$HOME/.android/avd}/test.ini"
          script: bash launcher/check-emulator.sh
      - name: Preserve UI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AdLessTV-ui-tests-${{ matrix.name }}
          path: |
            ui-results/
            launcher/app/build/reports/androidTests/
            launcher/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7
