name: Android TV launcher
on:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher.yml'
  pull_request:
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: chmod +x launcher/gradlew
      - name: Compile debug and release, and run Android lint
        working-directory: launcher
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:lintDebug :app:testDebugUnitTest
      - name: Preserve lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AdLessTV-lint-report
          path: |
            launcher/app/build/reports/lint-results-debug.html
            launcher/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Inspect APKs
        run: |
          test -s launcher/app/build/outputs/apk/debug/app-debug.apk
          test -s launcher/app/build/outputs/apk/release/app-release-unsigned.apk
          for apk in launcher/app/build/outputs/apk/debug/app-debug.apk launcher/app/build/outputs/apk/release/app-release-unsigned.apk; do
            declared_permissions=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$apk")
            unexpected_permissions=$(grep '^uses-permission' <<< "$declared_permissions" |
              grep -Fvx "uses-permission: name='com.adlesstv.launcher.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'" || true)
            if [ -n "$unexpected_permissions" ]; then
              echo "El lanzador solicita permisos inesperados: $apk" >&2
              echo "$declared_permissions" >&2
              exit 1
            fi
          done
      - name: Record APK identity and enforce size budgets
        run: |
          mkdir -p apk-evidence
          git rev-parse HEAD > apk-evidence/commit.txt
          python - <<'PY'
          from pathlib import Path
          limits = {'debug/app-debug.apk': 8, 'release/app-release-unsigned.apk': 3}
          for name, mib in limits.items():
              apk = Path('launcher/app/build/outputs/apk') / name
              size = apk.stat().st_size
              print(f'{name}: {size} bytes; limit {mib} MiB')
              if not 0 < size <= mib * 1024 * 1024:
                  raise SystemExit(f'APK exceeds budget: {name}')
          PY
          sha256sum launcher/app/build/outputs/apk/debug/*.apk launcher/app/build/outputs/apk/release/*.apk > apk-evidence/SHA256SUMS.txt
      - name: Exercise local release signing with an ephemeral CI key
        working-directory: launcher
        run: |
          keytool -genkeypair -noprompt -keystore ci-release.jks -storepass testpassword -keypass testpassword \
            -alias ci-test -dname 'CN=AdLessTV CI Test' -keyalg RSA -keysize 2048 -validity 365
          cat > keystore.properties <<'EOF'
          storeFile=ci-release.jks
          storePassword=testpassword
          keyAlias=ci-test
          keyPassword=testpassword
          EOF
          ./gradlew --no-daemon :app:assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          rm -f ci-release.jks keystore.properties
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AdLessTV-debug-apk
          path: |
            launcher/app/build/outputs/apk/debug/app-debug.apk
            apk-evidence/
          retention-days: 7

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android35
            api: 35
            target: google_apis
            arch: x86_64
            profile: pixel_2
          - name: tv34
            api: 34
            target: android-tv
            arch: x86
            profile: tv_1080p
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Enable hardware virtualization
        run: sudo chmod 666 /dev/kvm
      - run: chmod +x launcher/gradlew
      - name: Layout and D-pad on Android emulator
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 960x540
          script: bash launcher/check-emulator.sh
      - name: Preserve UI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AdLessTV-ui-tests-${{ matrix.name }}
          path: |
            ui-results/
            launcher/app/build/reports/androidTests/
            launcher/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7
